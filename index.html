<!DOCTYPE html>
<html lang="id" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Durrat al-Huda - Digital Library</title>
    
    <!-- Google Fonts: 10 Font Arab -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;500;600;700;800;900;1000&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Harmattan:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Mirza:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fustat:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.2s ease;
        }

        body {
            font-family: 'Noto Naskh Arabic', 'Amiri', serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.8;
            direction: rtl;
        }

        /* Variabel Tema */
        :root {
            --bg-primary: #f8f9fa;
            --bg-secondary: #ffffff;
            --text-primary: #212529;
            --text-secondary: #495057;
            --border: #dee2e6;
            --sidebar-bg: #f1f3f5;
            --hover-bg: #e9ecef;
            --accent: #2c7da0;
            --accent-dark: #1f5068;
            --shadow: rgba(0, 0, 0, 0.1);
            --card-bg: #ffffff;
            --navbar-bg: #ffffff;
        }

        body.dark {
            --bg-primary: #121212;
            --bg-secondary: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #aaaaaa;
            --border: #333333;
            --sidebar-bg: #1a1a1a;
            --hover-bg: #2a2a2a;
            --accent: #4ea8de;
            --accent-dark: #2c7da0;
            --shadow: rgba(0, 0, 0, 0.3);
            --card-bg: #252525;
            --navbar-bg: #1e1e1e;
        }

        /* Layout */
        .app {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Daftar Isi */
        .sidebar {
            width: 320px;
            background-color: var(--sidebar-bg);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: -2px 0 5px var(--shadow);
            z-index: 10;
            transition: transform 0.3s ease;
        }

        .sidebar.hide {
            transform: translateX(100%);
        }

        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            background-color: var(--bg-secondary);
        }

        .sidebar-header h2 {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .daftar-isi {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .daftar-isi ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .daftar-isi li {
            margin-bottom: 0.5rem;
            cursor: pointer;
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            transition: all 0.2s;
            font-size: 0.95rem;
            border-right: 3px solid transparent;
        }

        .daftar-isi li:hover {
            background-color: var(--hover-bg);
        }

        .daftar-isi li.active {
            background-color: var(--accent);
            color: white;
            border-right-color: var(--accent-dark);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Navbar / Toolbar */
        .navbar {
            padding: 0.75rem 1.5rem;
            background-color: var(--navbar-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.3s ease;
        }

        .navbar.hide {
            transform: translateY(-100%);
        }

        .navbar-brand {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .toolbar-group {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .toolbar button, .toolbar select {
            padding: 0.4rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-primary);
            color: var(--text-primary);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
        }

        .toolbar button:hover {
            background: var(--hover-bg);
        }

        .font-size-control {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .font-size-control span {
            font-size: 0.8rem;
            padding: 0 0.25rem;
        }

        .theme-toggle, .sidebar-toggle {
            background: var(--accent);
            color: white;
            border: none;
        }

        /* Konten Isi */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
        }

        .content-card {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .content-title {
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--accent);
            color: var(--accent);
        }

        .arabic-content {
            font-family: inherit;
            line-height: 2;
            font-size: 1.2rem;
            text-align: right;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .arabic-content p {
            margin-bottom: 1rem;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            font-style: italic;
            color: var(--text-secondary);
        }

        /* Tombol toggle sidebar (floating) */
        .toggle-sidebar-btn {
            position: fixed;
            top: 80px;
            right: 10px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px var(--shadow);
            transition: all 0.2s;
        }

        .toggle-sidebar-btn:hover {
            background: var(--accent-dark);
            transform: scale(1.05);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .app {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: 50%;
                position: fixed;
                bottom: 0;
                right: 0;
                left: 0;
                z-index: 15;
                border-left: none;
                border-top: 1px solid var(--border);
            }
            .sidebar.hide {
                transform: translateY(100%);
            }
            .main-content {
                height: 100%;
            }
            .navbar {
                padding: 0.5rem;
            }
            .content-card {
                padding: 1rem;
            }
            .toggle-sidebar-btn {
                top: auto;
                bottom: 20px;
                right: 20px;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>📖 درة الهدى</h2>
        </div>
        <div class="daftar-isi" id="daftarIsi">
            <div class="loading">Memuat daftar...</div>
        </div>
    </div>
    <div class="main-content">
        <div class="navbar" id="navbar">
            <div class="navbar-brand">تدرة الهدى</div>
            <div class="toolbar-group">
                <select id="fontFamilySelect">
                    <option value="'Noto Naskh Arabic', serif">📜 Noto Naskh Arabic</option>
                    <option value="'Noto Kufi Arabic', serif">🏛️ Noto Kufi Arabic</option>
                    <option value="'Noto Sans Arabic', sans-serif">📝 Noto Sans Arabic</option>
                    <option value="'Amiri', serif">🖋️ Amiri</option>
                    <option value="'Cairo', sans-serif">🌆 Cairo</option>
                    <option value="'Scheherazade New', serif">📖 Scheherazade New</option>
                    <option value="'Harmattan', sans-serif">✍️ Harmattan</option>
                    <option value="'Tajawal', sans-serif">✨ Tajawal</option>
                    <option value="'Mirza', serif">🎨 Mirza</option>
                    <option value="'Fustat', sans-serif">🔮 Fustat</option>
                </select>
                <div class="font-size-control">
                    <button id="fontMinus" title="Kecilkan font">A-</button>
                    <span id="fontSizeLabel">18px</span>
                    <button id="fontPlus" title="Besarkan font">A+</button>
                </div>
                <button id="themeToggle" class="theme-toggle">🌓 Dark/Light</button>
                <button id="hideNavbarBtn" class="sidebar-toggle">⬆️ Sembunyi</button>
            </div>
        </div>
        <div class="content-area" id="contentArea">
            <div class="content-card">
                <div class="content-title" id="contentTitle">الأسماء الحسنى</div>
                <div class="arabic-content" id="contentBody">Pilih bab dari daftar di samping untuk membaca isinya...</div>
            </div>
        </div>
    </div>
</div>
<button class="toggle-sidebar-btn" id="toggleSidebarBtn" title="Tampil/Sembunyi Daftar Isi">📑</button>

<script>
    // State
    let menuData = [];
    let contentCache = {};
    let currentId = null;
    let currentFontSize = 18;
    let currentFontFamily = "'Noto Naskh Arabic', serif";
    let sidebarVisible = true;
    let navbarVisible = true;

    // DOM Elements
    const daftarContainer = document.getElementById('daftarIsi');
    const contentTitleDiv = document.getElementById('contentTitle');
    const contentBodyDiv = document.getElementById('contentBody');
    const fontPlusBtn = document.getElementById('fontPlus');
    const fontMinusBtn = document.getElementById('fontMinus');
    const fontSizeLabel = document.getElementById('fontSizeLabel');
    const fontFamilySelect = document.getElementById('fontFamilySelect');
    const themeToggle = document.getElementById('themeToggle');
    const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
    const hideNavbarBtn = document.getElementById('hideNavbarBtn');
    const sidebar = document.getElementById('sidebar');
    const navbar = document.getElementById('navbar');

    // Load data.json
    async function loadData() {
        try {
            const response = await fetch('data.json');
            if (!response.ok) throw new Error('Gagal load data.json');
            const data = await response.json();
            menuData = data.menu;
            renderMenu(menuData);
            if (menuData.length > 0) {
                loadContent(menuData[0].id);
            }
        } catch (error) {
            console.error(error);
            daftarContainer.innerHTML = '<div class="loading">Gagal memuat daftar isi. Pastikan data.json tersedia.</div>';
        }
    }

    // Render menu
    function renderMenu(items) {
        if (items.length === 0) {
            daftarContainer.innerHTML = '<div class="loading">Tidak ada data</div>';
            return;
        }
        const ul = document.createElement('ul');
        items.forEach(item => {
            const li = document.createElement('li');
            li.textContent = item.title;
            li.dataset.id = item.id;
            if (currentId === item.id) li.classList.add('active');
            li.addEventListener('click', () => {
                loadContent(item.id);
                document.querySelectorAll('#daftarIsi li').forEach(el => el.classList.remove('active'));
                li.classList.add('active');
            });
            ul.appendChild(li);
        });
        daftarContainer.innerHTML = '';
        daftarContainer.appendChild(ul);
    }

    // Load content by ID
    async function loadContent(id) {
        if (!id) return;
        currentId = id;
        const menuItem = menuData.find(m => m.id === id);
        if (menuItem) {
            contentTitleDiv.textContent = menuItem.title;
        } else {
            contentTitleDiv.textContent = 'محتوى';
        }

        if (contentCache[id]) {
            renderContent(contentCache[id]);
            return;
        }

        contentBodyDiv.innerHTML = '<div class="loading">جاري التحميل...</div>';

        try {
            const response = await fetch(`data.json`);
            const fullData = await response.json();
            let rawContent = '';
            if (fullData.contents && fullData.contents[id]) {
                rawContent = fullData.contents[id];
            } else {
                rawContent = '<p style="color:red;">المحتوى غير متوفر حالياً</p>';
            }
            contentCache[id] = rawContent;
            renderContent(rawContent);
        } catch (err) {
            console.error(err);
            contentBodyDiv.innerHTML = '<div class="loading">خطأ في تحميل المحتوى</div>';
        }
    }

    function renderContent(htmlContent) {
        contentBodyDiv.innerHTML = htmlContent;
        applyFontSettings();
    }

    // Font settings
    function applyFontSettings() {
        const arabicDiv = document.getElementById('contentBody');
        if (arabicDiv) {
            arabicDiv.style.fontSize = currentFontSize + 'px';
            arabicDiv.style.fontFamily = currentFontFamily;
        }
        fontSizeLabel.innerText = currentFontSize + 'px';
    }

    function changeFontSize(delta) {
        let newSize = currentFontSize + delta;
        if (newSize < 12) newSize = 12;
        if (newSize > 36) newSize = 36;
        currentFontSize = newSize;
        applyFontSettings();
        localStorage.setItem('dh_fontSize', currentFontSize);
    }

    function setFontFamily(family) {
        currentFontFamily = family;
        applyFontSettings();
        localStorage.setItem('dh_fontFamily', family);
    }

    // Theme
    function initTheme() {
        const savedTheme = localStorage.getItem('dh_theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark');
        } else {
            document.body.classList.remove('dark');
        }
    }

    function toggleTheme() {
        document.body.classList.toggle('dark');
        const isDark = document.body.classList.contains('dark');
        localStorage.setItem('dh_theme', isDark ? 'dark' : 'light');
    }

    // Toggle Sidebar
    function toggleSidebar() {
        sidebarVisible = !sidebarVisible;
        if (sidebarVisible) {
            sidebar.classList.remove('hide');
            toggleSidebarBtn.innerHTML = '📑';
        } else {
            sidebar.classList.add('hide');
            toggleSidebarBtn.innerHTML = '📖';
        }
        localStorage.setItem('dh_sidebar', sidebarVisible);
    }

    // Toggle Navbar
    function toggleNavbar() {
        navbarVisible = !navbarVisible;
        if (navbarVisible) {
            navbar.classList.remove('hide');
            hideNavbarBtn.innerHTML = '⬆️ Sembunyi';
        } else {
            navbar.classList.add('hide');
            hideNavbarBtn.innerHTML = '⬇️ Tampil';
        }
        localStorage.setItem('dh_navbar', navbarVisible);
    }

    // Load preferences
    function loadPreferences() {
        const savedSize = localStorage.getItem('dh_fontSize');
        if (savedSize) currentFontSize = parseInt(savedSize);
        const savedFamily = localStorage.getItem('dh_fontFamily');
        if (savedFamily) {
            currentFontFamily = savedFamily;
            fontFamilySelect.value = savedFamily;
        }
        const savedSidebar = localStorage.getItem('dh_sidebar');
        if (savedSidebar === 'false') {
            sidebarVisible = false;
            sidebar.classList.add('hide');
            toggleSidebarBtn.innerHTML = '📖';
        }
        const savedNavbar = localStorage.getItem('dh_navbar');
        if (savedNavbar === 'false') {
            navbarVisible = false;
            navbar.classList.add('hide');
            hideNavbarBtn.innerHTML = '⬇️ Tampil';
        }
        applyFontSettings();
        initTheme();
    }

    // Event Listeners
    fontPlusBtn.addEventListener('click', () => changeFontSize(2));
    fontMinusBtn.addEventListener('click', () => changeFontSize(-2));
    fontFamilySelect.addEventListener('change', (e) => {
        setFontFamily(e.target.value);
    });
    themeToggle.addEventListener('click', toggleTheme);
    toggleSidebarBtn.addEventListener('click', toggleSidebar);
    hideNavbarBtn.addEventListener('click', toggleNavbar);

    // Initialize
    loadPreferences();
    loadData();
</script>
</body>
</html>
