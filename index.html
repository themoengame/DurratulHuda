<!DOCTYPE html>
<html lang="id" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Durrat al-Huda - Digital Library</title>
    
    <!-- Google Fonts (Font Arab berkualitas) -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lateef:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Variabel Tema */
        :root {
            --bg-primary: #f8f9fa;
            --bg-secondary: #ffffff;
            --text-primary: #212529;
            --text-secondary: #495057;
            --border: #dee2e6;
            --sidebar-bg: #f1f3f5;
            --hover-bg: #e9ecef;
            --accent: #2c7da0;
            --accent-dark: #1f5068;
            --accent-light: #e8f4f8;
            --shadow: rgba(0, 0, 0, 0.1);
            --card-bg: #ffffff;
            --toolbar-bg: #ffffff;
        }

        body.dark {
            --bg-primary: #121212;
            --bg-secondary: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #aaaaaa;
            --border: #333333;
            --sidebar-bg: #1a1a1a;
            --hover-bg: #2a2a2a;
            --accent: #4ea8de;
            --accent-dark: #2c7da0;
            --accent-light: #1e3a4a;
            --shadow: rgba(0, 0, 0, 0.3);
            --card-bg: #252525;
            --toolbar-bg: #1e1e1e;
        }

        body {
            font-family: 'Amiri', 'Traditional Arabic', serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.8;
            transition: background-color 0.3s ease, color 0.2s ease;
        }

        /* Layout Utama */
        .app {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar - Menu Daftar Isi */
        .sidebar {
            width: 320px;
            background-color: var(--sidebar-bg);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            z-index: 100;
            transform: translateX(0);
            transition: transform 0.3s ease;
            box-shadow: -2px 0 5px var(--shadow);
        }

        .sidebar.closed {
            transform: translateX(100%);
        }

        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            background-color: var(--bg-secondary);
        }

        .sidebar-header h2 {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .search-box {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
        }

        .daftar-isi {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .daftar-isi ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .daftar-isi li {
            margin-bottom: 0.5rem;
            cursor: pointer;
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            transition: all 0.2s;
            font-size: 0.95rem;
            border-right: 3px solid transparent;
        }

        .daftar-isi li:hover {
            background-color: var(--hover-bg);
        }

        .daftar-isi li.active {
            background-color: var(--accent);
            color: white;
            border-right-color: var(--accent-dark);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-right: 320px;
            transition: margin-right 0.3s ease;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-content.fullscreen {
            margin-right: 0;
        }

        /* Toolbar */
        .toolbar {
            padding: 0.75rem 1.5rem;
            background-color: var(--toolbar-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(10px);
            background-color: rgba(var(--toolbar-bg-rgb, 255,255,255), 0.95);
        }

        body.dark .toolbar {
            background-color: rgba(30, 30, 30, 0.95);
        }

        .toolbar-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .toolbar button, .toolbar select {
            padding: 0.4rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-primary);
            color: var(--text-primary);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .toolbar button:hover {
            background: var(--hover-bg);
        }

        .btn-icon {
            font-size: 1.1rem;
            padding: 0.4rem 0.6rem;
        }

        .menu-toggle {
            background: var(--accent);
            color: white;
            border: none;
            font-weight: bold;
        }

        .menu-toggle:hover {
            background: var(--accent-dark);
        }

        .theme-toggle {
            background: var(--accent);
            color: white;
            border: none;
        }

        .fullscreen-toggle {
            background: var(--accent);
            color: white;
            border: none;
        }

        .font-size-control {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .font-size-control span {
            font-size: 0.8rem;
            padding: 0 0.25rem;
            min-width: 45px;
            text-align: center;
        }

        /* Content Area */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
        }

        .content-card {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .content-title {
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--accent);
            color: var(--accent);
        }

        .arabic-content {
            font-family: inherit;
            line-height: 2;
            font-size: 1.2rem;
            text-align: right;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .arabic-content p {
            margin-bottom: 1rem;
        }

        .arabic-content table {
            width: 100%;
            margin: 1rem 0;
            border-collapse: collapse;
        }

        .arabic-content td {
            border: 1px solid var(--border);
            padding: 0.5rem;
            text-align: center;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            font-style: italic;
            color: var(--text-secondary);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 280px;
            }
            .main-content {
                margin-right: 0;
            }
            .toolbar {
                padding: 0.5rem;
                gap: 0.5rem;
            }
            .toolbar-group {
                gap: 0.3rem;
            }
            .toolbar button, .toolbar select {
                padding: 0.3rem 0.5rem;
                font-size: 0.75rem;
            }
            .content-card {
                padding: 1rem;
            }
            .content-title {
                font-size: 1.3rem;
            }
        }

        /* Fullscreen mode khusus untuk bacaan - toolbar tetap ada tapi minimalis */
        .reading-mode .sidebar {
            transform: translateX(100%);
        }
        
        .reading-mode .main-content {
            margin-right: 0;
        }
        
        .reading-mode .toolbar {
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        
        .reading-mode .toolbar:hover {
            opacity: 1;
        }

        /* Highlight search */
        .highlight {
            background-color: #ffc107;
            color: #1e1e1e;
            border-radius: 2px;
            padding: 0 2px;
        }
        body.dark .highlight {
            background-color: #ffb300;
            color: #000;
        }

        /* Tombol close sidebar di mobile */
        .sidebar-close {
            display: none;
            position: absolute;
            left: 1rem;
            top: 1rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .sidebar-close {
                display: block;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Sidebar Menu -->
    <div class="sidebar" id="sidebar">
        <button class="sidebar-close" id="sidebarCloseBtn">✕</button>
        <div class="sidebar-header">
            <h2>📖 درة الهدى</h2>
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 Cari judul..." autocomplete="off">
        </div>
        <div class="daftar-isi" id="daftarIsi">
            <div class="loading">Memuat daftar...</div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <div class="toolbar">
            <div class="toolbar-group">
                <button id="menuToggleBtn" class="menu-toggle btn-icon" title="Tampilkan Menu">📑 Menu</button>
                <button id="fullscreenToggleBtn" class="fullscreen-toggle btn-icon" title="Mode Membaca (Fullscreen)">📖 Fullscreen</button>
                <button id="themeToggle" class="theme-toggle btn-icon" title="Gelap/Terang">🌓</button>
            </div>
            <div class="toolbar-group">
                <select id="fontFamilySelect">
                    <option value="'Amiri', serif">📜 Amiri</option>
                    <option value="'Scheherazade New', serif">🖋️ Scheherazade</option>
                    <option value="'Lateef', cursive">✍️ Lateef</option>
                    <option value="'Noto Naskh Arabic', serif">📖 Noto Naskh</option>
                    <option value="'El Messiri', sans-serif">✨ El Messiri</option>
                    <option value="'Reem Kufi', sans-serif">🔤 Reem Kufi</option>
                    <option value="'Cairo', sans-serif">📚 Cairo</option>
                    <option value="'Tajawal', sans-serif">🍃 Tajawal</option>
                    <option value="'Almarai', sans-serif">🌙 Almarai</option>
                    <option value="'Traditional Arabic', 'Times New Roman', serif">📜 Traditional</option>
                </select>
                <div class="font-size-control">
                    <button id="fontMinus" title="Kecilkan font">A-</button>
                    <span id="fontSizeLabel">20px</span>
                    <button id="fontPlus" title="Besarkan font">A+</button>
                </div>
            </div>
        </div>
        <div class="content-area" id="contentArea">
            <div class="content-card">
                <div class="content-title" id="contentTitle">الأسماء الحسنى</div>
                <div class="arabic-content" id="contentBody">Pilih bab dari daftar di samping untuk membaca isinya...</div>
            </div>
        </div>
    </div>
</div>

<script>
    // State
    let menuData = [];
    let contentCache = {};
    let currentId = null;
    let currentFontSize = 20;
    let currentFontFamily = "'Amiri', serif";
    let isReadingMode = false;
    let isSidebarOpen = true;

    // DOM Elements
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('mainContent');
    const daftarContainer = document.getElementById('daftarIsi');
    const searchInput = document.getElementById('searchInput');
    const contentTitleDiv = document.getElementById('contentTitle');
    const contentBodyDiv = document.getElementById('contentBody');
    const fontPlusBtn = document.getElementById('fontPlus');
    const fontMinusBtn = document.getElementById('fontMinus');
    const fontSizeLabel = document.getElementById('fontSizeLabel');
    const fontFamilySelect = document.getElementById('fontFamilySelect');
    const themeToggle = document.getElementById('themeToggle');
    const menuToggleBtn = document.getElementById('menuToggleBtn');
    const fullscreenToggleBtn = document.getElementById('fullscreenToggleBtn');
    const sidebarCloseBtn = document.getElementById('sidebarCloseBtn');

    // Load data.json
    async function loadData() {
        try {
            const response = await fetch('data.json');
            if (!response.ok) throw new Error('Gagal load data.json');
            const data = await response.json();
            menuData = data.menu;
            renderMenu(menuData);
            if (menuData.length > 0) {
                loadContent(menuData[0].id);
            }
        } catch (error) {
            console.error(error);
            daftarContainer.innerHTML = '<div class="loading">❌ Gagal memuat daftar isi. Pastikan data.json tersedia.</div>';
        }
    }

    // Render menu with search filter
    function renderMenu(items) {
        const searchTerm = searchInput.value.trim().toLowerCase();
        let filtered = items;
        if (searchTerm) {
            filtered = items.filter(item => item.title.toLowerCase().includes(searchTerm));
        }

        if (filtered.length === 0) {
            daftarContainer.innerHTML = '<div class="loading">Tidak ditemukan</div>';
            return;
        }

        const ul = document.createElement('ul');
        filtered.forEach(item => {
            const li = document.createElement('li');
            li.textContent = item.title;
            li.dataset.id = item.id;
            if (currentId === item.id) li.classList.add('active');
            li.addEventListener('click', () => {
                loadContent(item.id);
                document.querySelectorAll('#daftarIsi li').forEach(el => el.classList.remove('active'));
                li.classList.add('active');
                // Di mobile, tutup sidebar setelah klik
                if (window.innerWidth <= 768) {
                    closeSidebar();
                }
            });
            ul.appendChild(li);
        });
        daftarContainer.innerHTML = '';
        daftarContainer.appendChild(ul);
    }

    // Load content by ID
    async function loadContent(id) {
        if (!id) return;
        currentId = id;
        const menuItem = menuData.find(m => m.id === id);
        if (menuItem) {
            contentTitleDiv.textContent = menuItem.title;
        } else {
            contentTitleDiv.textContent = 'محتوى';
        }

        if (contentCache[id]) {
            renderContent(contentCache[id]);
            return;
        }

        contentBodyDiv.innerHTML = '<div class="loading">جاري التحميل...</div>';

        try {
            const response = await fetch(`data.json`);
            const fullData = await response.json();
            let rawContent = '';
            if (fullData.contents && fullData.contents[id]) {
                rawContent = fullData.contents[id];
            } else {
                rawContent = '<p style="color:red;">المحتوى غير متوفر حالياً</p>';
            }
            contentCache[id] = rawContent;
            renderContent(rawContent);
        } catch (err) {
            console.error(err);
            contentBodyDiv.innerHTML = '<div class="loading">خطأ في تحميل المحتوى</div>';
        }
    }

    function renderContent(htmlContent) {
        contentBodyDiv.innerHTML = htmlContent;
        applyFontSettings();
    }

    // Font settings
    function applyFontSettings() {
        const arabicDiv = document.getElementById('contentBody');
        if (arabicDiv) {
            arabicDiv.style.fontSize = currentFontSize + 'px';
            arabicDiv.style.fontFamily = currentFontFamily;
        }
        fontSizeLabel.innerText = currentFontSize + 'px';
    }

    function changeFontSize(delta) {
        let newSize = currentFontSize + delta;
        if (newSize < 12) newSize = 12;
        if (newSize > 40) newSize = 40;
        currentFontSize = newSize;
        applyFontSettings();
        localStorage.setItem('dh_fontSize', currentFontSize);
    }

    function setFontFamily(family) {
        currentFontFamily = family;
        applyFontSettings();
        localStorage.setItem('dh_fontFamily', family);
    }

    // Theme
    function initTheme() {
        const savedTheme = localStorage.getItem('dh_theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark');
        } else {
            document.body.classList.remove('dark');
        }
    }

    function toggleTheme() {
        document.body.classList.toggle('dark');
        const isDark = document.body.classList.contains('dark');
        localStorage.setItem('dh_theme', isDark ? 'dark' : 'light');
    }

    // Sidebar Toggle
    function toggleSidebar() {
        isSidebarOpen = !isSidebarOpen;
        if (isSidebarOpen) {
            sidebar.classList.remove('closed');
            mainContent.classList.remove('fullscreen');
        } else {
            sidebar.classList.add('closed');
            mainContent.classList.add('fullscreen');
        }
        localStorage.setItem('dh_sidebarOpen', isSidebarOpen);
    }

    function closeSidebar() {
        isSidebarOpen = false;
        sidebar.classList.add('closed');
        mainContent.classList.add('fullscreen');
        localStorage.setItem('dh_sidebarOpen', false);
    }

    function openSidebar() {
        isSidebarOpen = true;
        sidebar.classList.remove('closed');
        mainContent.classList.remove('fullscreen');
        localStorage.setItem('dh_sidebarOpen', true);
    }

    // Fullscreen Reading Mode (clean interface)
    function toggleReadingMode() {
        isReadingMode = !isReadingMode;
        if (isReadingMode) {
            document.body.classList.add('reading-mode');
            fullscreenToggleBtn.innerHTML = '📖 Exit';
            fullscreenToggleBtn.title = 'Keluar Mode Membaca';
            closeSidebar();
        } else {
            document.body.classList.remove('reading-mode');
            fullscreenToggleBtn.innerHTML = '📖 Fullscreen';
            fullscreenToggleBtn.title = 'Mode Membaca';
            // Restore sidebar preference
            const savedSidebar = localStorage.getItem('dh_sidebarOpen');
            if (savedSidebar === 'true') {
                openSidebar();
            }
        }
        localStorage.setItem('dh_readingMode', isReadingMode);
    }

    // Load preferences
    function loadPreferences() {
        const savedSize = localStorage.getItem('dh_fontSize');
        if (savedSize) currentFontSize = parseInt(savedSize);
        const savedFamily = localStorage.getItem('dh_fontFamily');
        if (savedFamily) {
            currentFontFamily = savedFamily;
            fontFamilySelect.value = savedFamily;
        }
        const savedSidebar = localStorage.getItem('dh_sidebarOpen');
        if (savedSidebar === 'false') {
            isSidebarOpen = false;
            sidebar.classList.add('closed');
            mainContent.classList.add('fullscreen');
        }
        const savedReadingMode = localStorage.getItem('dh_readingMode');
        if (savedReadingMode === 'true') {
            isReadingMode = true;
            document.body.classList.add('reading-mode');
            fullscreenToggleBtn.innerHTML = '📖 Exit';
            closeSidebar();
        }
        applyFontSettings();
        initTheme();
    }

    // Event Listeners
    fontPlusBtn.addEventListener('click', () => changeFontSize(2));
    fontMinusBtn.addEventListener('click', () => changeFontSize(-2));
    fontFamilySelect.addEventListener('change', (e) => setFontFamily(e.target.value));
    themeToggle.addEventListener('click', toggleTheme);
    menuToggleBtn.addEventListener('click', toggleSidebar);
    fullscreenToggleBtn.addEventListener('click', toggleReadingMode);
    if (sidebarCloseBtn) {
        sidebarCloseBtn.addEventListener('click', closeSidebar);
    }
    searchInput.addEventListener('input', () => renderMenu(menuData));

    // Initialize
    loadPreferences();
    loadData();
</script>
</body>
</html>
