<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Durratul Hadi - Daftar Isi Jilid 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        /* Variabel Tema */
        :root {
            --bg-body: #e9e4d8;
            --bg-container: #fffef7;
            --bg-header: #2e3820;
            --text-header: #f9eec1;
            --text-primary: #2d2a1e;
            --text-secondary: #5f553b;
            --border-color: #e2d5ba;
            --accent: #b8863b;
            --accent-light: #fcf8e8;
            --item-hover: #fcf8e8;
            --control-bg: #faf6e9;
            --btn-bg: #d8c89c;
            --btn-hover: #c2ae78;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        body.dark {
            --bg-body: #1a1a2e;
            --bg-container: #16213e;
            --bg-header: #0f3460;
            --text-header: #e8e8e8;
            --text-primary: #e8e8e8;
            --text-secondary: #a0a0a0;
            --border-color: #2c3e66;
            --accent: #e94560;
            --accent-light: #1a2a4a;
            --item-hover: #1f2a4a;
            --control-bg: #0f2a3e;
            --btn-bg: #533483;
            --btn-hover: #7b4ca0;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            background: var(--bg-body);
            font-family: 'Segoe UI', 'Traditional Arabic', 'Sakkal Majalla', 'Times New Roman', serif;
            padding: 1rem;
            min-height: 100vh;
        }

        /* Container */
        .book-container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--bg-container);
            border-radius: 28px;
            box-shadow: 0 25px 45px -12px var(--shadow);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        /* Header */
        .header {
            background: var(--bg-header);
            padding: 1.5rem;
            text-align: center;
            border-bottom: 4px solid var(--accent);
        }

        .header h1 {
            font-family: 'Traditional Arabic', 'Sakkal Majalla', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-header);
            letter-spacing: 1px;
        }

        .header h2 {
            font-size: 0.9rem;
            color: var(--accent);
            margin-top: 8px;
        }

        /* Control Panel */
        .control-panel {
            background: var(--control-bg);
            padding: 0.8rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-container);
            padding: 5px 12px;
            border-radius: 40px;
            border: 1px solid var(--border-color);
        }

        .control-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        select, .theme-btn {
            padding: 5px 10px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--bg-container);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.8rem;
        }

        .font-size-btns {
            display: flex;
            gap: 5px;
        }

        .font-size-btns button {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: var(--btn-bg);
            color: var(--text-primary);
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }

        .font-size-btns button:hover {
            background: var(--btn-hover);
        }

        .theme-btn {
            background: var(--btn-bg);
            padding: 5px 15px;
        }

        /* Back Button */
        .back-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            margin-left: auto;
        }

        /* Daftar Isi */
        .toc-list, .content-page {
            padding: 1.5rem;
            min-height: 500px;
        }

        .toc-item {
            display: flex;
            align-items: baseline;
            gap: 12px;
            padding: 10px 16px;
            margin: 6px 0;
            border-radius: 14px;
            cursor: pointer;
            direction: rtl;
            text-align: right;
            font-family: inherit;
            font-size: inherit;
            border-left: 4px solid transparent;
            transition: all 0.2s;
        }

        .toc-item:hover {
            background: var(--item-hover);
            border-left-color: var(--accent);
            transform: translateX(-3px);
        }

        .toc-bullet {
            font-size: 1.2em;
            color: var(--accent);
            min-width: 28px;
        }

        .toc-text {
            flex: 1;
        }

        /* Konten Halaman - perbaikan untuk grid Asmaul Husna */
        .content-page {
            direction: rtl;
            font-family: inherit;
            font-size: inherit;
        }

        .content-page .arabic-text {
            line-height: 1.8;
        }

        .content-page .basmalah {
            font-size: 1.3em;
            text-align: center;
            margin: 15px 0;
            color: var(--accent);
        }

        .content-page .doa-title {
            font-size: 1.2em;
            font-weight: bold;
            text-align: center;
            margin: 20px 0 10px;
            color: var(--accent);
        }

        /* GRID UNTUK ASMAUL HUSNA - RESPONSIF */
        .asma-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 8px 20px;
            margin: 20px 0;
            line-height: 1.8;
        }
        
        .asma-item {
            display: flex;
            align-items: baseline;
            gap: 6px;
            padding: 2px 0;
            white-space: normal;
            word-break: keep-all;
        }
        
        .asma-bullet {
            color: var(--accent);
            font-size: 1.1em;
            margin-left: 4px;
            flex-shrink: 0;
        }
        
        .asma-name {
            flex: 1;
        }

        @media (max-width: 550px) {
            .asma-grid {
                grid-template-columns: 1fr;
                gap: 4px;
            }
        }

        .no-result {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .footer {
            background: var(--control-bg);
            padding: 0.8rem;
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
<div class="book-container" id="app">
    <div class="header">
        <h1>محتویات كتاب درة الهدى</h1>
        <h2>المجلد الأول — Durratul Hadi Jilid 1</h2>
    </div>

    <div class="control-panel">
        <div class="control-group">
            <label>📖 Font:</label>
            <select id="fontFamilySelect">
                <option value="'Traditional Arabic', 'Sakkal Majalla', 'Times New Roman', serif">Traditional Arabic</option>
                <option value="'Amiri', 'Times New Roman', serif">Amiri</option>
                <option value="'Segoe UI', 'Tahoma', sans-serif">Segoe UI</option>
                <option value="'Arial', sans-serif">Arial</option>
                <option value="'Courier New', monospace">Courier New</option>
            </select>
        </div>
        <div class="control-group">
            <label>🔤 Ukuran:</label>
            <div class="font-size-btns">
                <button id="fontMinus" title="Perkecil">A-</button>
                <button id="fontPlus" title="Perbesar">A+</button>
                <button id="fontReset" title="Reset">A</button>
            </div>
        </div>
        <div class="control-group">
            <button id="themeToggle" class="theme-btn">🌙 Gelap</button>
        </div>
        <button id="backToToc" class="back-btn" style="display:none;">← Kembali ke Daftar Isi</button>
    </div>

    <div id="mainContent">
        <div class="toc-list" id="tocContainer">Memuat daftar isi...</div>
    </div>

    <div class="footer">
        📖 Klik pada judul untuk membaca | Ukuran & jenis font dapat diubah | Tema gelap/terang
    </div>
</div>

<script>
    // Data daftar isi (tanpa halaman)
    const tocData = [
        "الأسماء الحسنى",
        "سورة يس",
        "دعاء بعد سورة يس",
        "سورة الكهف",
        "سورة محمد",
        "سورة السجدة",
        "سورة الدخان",
        "سورة الرحمن",
        "سورة الواقعة",
        "دعاء بعد سورة الواقعة",
        "سورة الحشر",
        "سورة الملك",
        "دعاء بعد سورة الملك",
        "الأوراد قبل صلاة الصبح",
        "الأوراد بعد صلاة المكتوبة",
        "الأوراد بعد صلاة الصبح",
        "الأوراد بعد صلاة العصر",
        "الأوراد بعد صلاة المغرب",
        "الأوراد قبل صلاة العشاء",
        "الأوراد قبل المكتوبة في شهر رمضان",
        "دعاء قنوت النازلة",
        "دعاء (صلاة) الترحيـم",
        "قصيدة زيارة الأولياء",
        "التوسل قبل التهليل",
        "التهليل",
        "دعاء التهليل",
        "الاستغاثة ودعاؤها",
        "يسأل فضيلة",
        "خصوصية ودعاؤها",
        "الصلاة الإبراهيمية",
        "الصلاة المنجية",
        "الصلاة النارية",
        "الصلاة الفاتح",
        "الصلاة الحجية",
        "الصلاة الطبية",
        "الصلاة الطريقية",
        "راتب الحداد",
        "قصيدة للحبيب عبد الله ابن علوي الحداد",
        "دعاء السلامة",
        "دعاء صلاة التراويح",
        "دعاء صلاة الوتر",
        "دعاء صلاة التهجد",
        "دعاء صلاة الاستخارة",
        "دعاء صلاة الحاجة",
        "دعاء أول السنة",
        "دعاء آخر السنة",
        "دعاء ليلة عاشوراء",
        "دعاء نصف الشعبان",
        "دعاء (التسبيح) ليلة العرفة",
        "صلاة التسبيح",
        "دعاء صلاة التسبيح",
        "صلاة في ليلة القدر",
        "صلاة الجنازة",
        "صلاة الهدية",
        "صلاة لأنس القبر",
        "صلاة الكفارات",
        "صلاة ربو وكاسان",
        "دعاء بعد صلاة ربو وكاسن",
        "كيفية عقد النكاح",
        "الدعاء بعد عقد النكاح",
        "الدُّعَاءُ بَعْدَ عَقْدِ النِّكَاحِ"
    ];

    // State
    let currentFontSize = 18;
    let currentFontFamily = "'Traditional Arabic', 'Sakkal Majalla', 'Times New Roman', serif";
    let currentTheme = 'light';
    let currentPage = null;

    

    // Render daftar isi
    function renderToc() {
        const container = document.getElementById('tocContainer');
        if (!container) return;
        
        let html = '';
        tocData.forEach(title => {
            html += `
                <div class="toc-item" data-title="${escapeHtml(title)}">
                    <div class="toc-bullet">❂</div>
                    <div class="toc-text" dir="rtl">${escapeHtml(title)}</div>
                </div>
            `;
        });
        container.innerHTML = html;
        
        document.querySelectorAll('.toc-item').forEach(item => {
            item.addEventListener('click', () => {
                const title = item.getAttribute('data-title');
                openPage(title);
            });
        });
    }
    
    // Buka halaman
    async function openPage(title) {
        currentPage = title;
        
        let content = '';
        if (title === 'الأسماء الحسنى') {
            content = getAsmaulHusnaHTML();
        } else {
            content = `<div class="arabic-text" style="text-align:center;padding:50px;"><p>📖 ${title}</p><p style="font-size:0.9rem;margin-top:20px;">Konten sedang disiapkan</p></div>`;
        }
        
        const mainContent = document.getElementById('mainContent');
        mainContent.innerHTML = `
            <div class="content-page" id="contentPage" dir="rtl">
                ${content}
            </div>
        `;
        
        applyFontSettingsToContent();
        document.getElementById('backToToc').style.display = 'flex';
    }
    
    function goBackToToc() {
        currentPage = null;
        const mainContent = document.getElementById('mainContent');
        mainContent.innerHTML = `<div class="toc-list" id="tocContainer">Memuat daftar isi...</div>`;
        renderToc();
        document.getElementById('backToToc').style.display = 'none';
        applyFontSettingsToContent();
    }
    
    function applyFontSettingsToContent() {
        const container = document.getElementById('app');
        if (container) {
            container.style.fontSize = currentFontSize + 'px';
            container.style.fontFamily = currentFontFamily;
        }
        const contentPage = document.getElementById('contentPage');
        if (contentPage) {
            contentPage.style.fontSize = currentFontSize + 'px';
            contentPage.style.fontFamily = currentFontFamily;
        }
        const tocContainer = document.getElementById('tocContainer');
        if (tocContainer) {
            tocContainer.style.fontSize = currentFontSize + 'px';
            tocContainer.style.fontFamily = currentFontFamily;
        }
    }
    
    function saveSettings() {
        localStorage.setItem('dh_fontSize', currentFontSize);
        localStorage.setItem('dh_fontFamily', currentFontFamily);
        localStorage.setItem('dh_theme', currentTheme);
    }
    
    function loadSettings() {
        const savedSize = localStorage.getItem('dh_fontSize');
        if (savedSize) currentFontSize = parseInt(savedSize);
        const savedFont = localStorage.getItem('dh_fontFamily');
        if (savedFont) currentFontFamily = savedFont;
        const savedTheme = localStorage.getItem('dh_theme');
        if (savedTheme) {
            currentTheme = savedTheme;
            if (currentTheme === 'dark') {
                document.body.classList.add('dark');
                document.getElementById('themeToggle').innerHTML = '☀️ Terang';
            } else {
                document.body.classList.remove('dark');
                document.getElementById('themeToggle').innerHTML = '🌙 Gelap';
            }
        }
        const fontSelect = document.getElementById('fontFamilySelect');
        if (fontSelect && currentFontFamily) {
            for (let i = 0; i < fontSelect.options.length; i++) {
                if (fontSelect.options[i].value === currentFontFamily) {
                    fontSelect.selectedIndex = i;
                    break;
                }
            }
        }
        applyFontSettingsToContent();
    }
    
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // Event listeners
    document.getElementById('fontPlus')?.addEventListener('click', () => {
        currentFontSize = Math.min(currentFontSize + 2, 36);
        applyFontSettingsToContent();
        saveSettings();
    });
    document.getElementById('fontMinus')?.addEventListener('click', () => {
        currentFontSize = Math.max(currentFontSize - 2, 12);
        applyFontSettingsToContent();
        saveSettings();
    });
    document.getElementById('fontReset')?.addEventListener('click', () => {
        currentFontSize = 18;
        applyFontSettingsToContent();
        saveSettings();
    });
    document.getElementById('fontFamilySelect')?.addEventListener('change', (e) => {
        currentFontFamily = e.target.value;
        applyFontSettingsToContent();
        saveSettings();
    });
    document.getElementById('themeToggle')?.addEventListener('click', () => {
        if (currentTheme === 'light') {
            currentTheme = 'dark';
            document.body.classList.add('dark');
            document.getElementById('themeToggle').innerHTML = '☀️ Terang';
        } else {
            currentTheme = 'light';
            document.body.classList.remove('dark');
            document.getElementById('themeToggle').innerHTML = '🌙 Gelap';
        }
        saveSettings();
    });
    document.getElementById('backToToc')?.addEventListener('click', goBackToToc);
    
    // Inisialisasi
    function init() {
        renderToc();
        loadSettings();
        applyFontSettingsToContent();
    }
    
    init();
</script>
</body>
</html>
